# A tag is the release. What is published is whatever the tag points at, so
# this runs the whole gate again on the tagged commit rather than trusting
# that it was green on main, and refuses a tag that disagrees with the
# version in build.zig.zon, which is what `gnarl --version` prints. Once the
# release is public, kmoneil/homebrew-tap is told, and it moves its gnarl
# formula to the release after checking and installing it.
name: release

on:
  push:
    tags:
      - "v*"
  # A dry run: the gate, the binaries and their checksums, kept as this
  # run's artifact. Nothing is attested or published on a dispatch: `attest`
  # and `publish` are guarded on the event being a tag push rather than on
  # the ref, because a dispatch can name a tag as its ref.
  workflow_dispatch:

# Read at the workflow level, write only on the jobs that need it. Every job
# inherits a workflow-level permission, so a token is scoped where it is
# used or it is scoped everywhere.
permissions:
  contents: read

jobs:
  gate:
    name: the full gate, on the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No cache, here or in the build: a release builds from nothing it
      # did not make.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      - name: the tag is build.zig.zon's version
        if: github.event_name == 'push'
        run: |
          zig build
          want="gnarl ${GITHUB_REF_NAME#v}"
          got="$(./zig-out/bin/gnarl --version)"
          if [ "$got" != "$want" ]; then
            echo "The tag is ${GITHUB_REF_NAME} but the binary says '${got}'." >&2
            echo "Set .version in build.zig.zon to ${GITHUB_REF_NAME#v} on main and tag that commit." >&2
            exit 1
          fi
      # zigvet, a released binary checked against its release's checksums,
      # as ci.yml installs it.
      - name: install zigvet
        env:
          GH_TOKEN: ${{ github.token }}
          ZIGVET: v0.19.0
        run: |
          dir="$RUNNER_TEMP/zigvet"
          gh release download "$ZIGVET" --repo kmoneil/zigvet --pattern zigvet-linux-amd64 --pattern SHA256SUMS --dir "$dir"
          cd "$dir"
          grep ' zigvet-linux-amd64$' SHA256SUMS | sha256sum -c -
          mv zigvet-linux-amd64 zigvet && chmod +x zigvet
          echo "$dir" >> "$GITHUB_PATH"
      - name: zigvet over gnarl's source
        run: zig build lint
      # The tests, the golden tables, the docs held to the binary, the
      # formatting, and gnarl held to its own baseline, in every mode.
      - name: zig build test, in every mode
        run: |
          zig build test --summary all
          zig build test -Doptimize=ReleaseSafe --summary all
          zig build test -Doptimize=ReleaseFast --summary all

  build:
    name: build the binaries
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      # The six targets and their names are build.zig's release_targets,
      # the same list ci.yml builds on every change.
      - name: zig build release
        run: zig build release
      # The runner can execute one of them; it must start, name its
      # version, and hold gnarl's own source to complexity.baseline.
      - name: the Linux binary runs
        run: |
          ./zig-out/release/gnarl-linux-amd64 --version
          ./zig-out/release/gnarl-linux-amd64 --check
      - name: checksums
        run: cd zig-out/release && sha256sum gnarl-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: zig-out/release/
          retention-days: 7
          if-no-files-found: error

  attest:
    name: attest the assets
    needs: build
    # An attestation is a signed statement in this repository's public
    # store, so writing one is publishing: on a dispatch the job never
    # starts and the token that would sign is never minted.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      # Every file publish uploads: a signed statement that each was built
      # by this workflow, from this tag, on a runner GitHub hosts. Checked
      # with
      #   gh attestation verify gnarl-linux-amd64 --repo kmoneil/gnarl
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  publish:
    name: publish
    # Nothing is published that was not attested first.
    needs: [build, attest]
    # Guarded on the job, not a step, so on a dispatch the write token is
    # never minted.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      # A draft first, so releases/latest never names a release whose
      # assets are still uploading, then made public in the same job. A
      # hyphen is what separates a semver prerelease from a release, so
      # v0.2.0-rc.1 is marked a prerelease and not made the latest.
      - name: create the GitHub release, a draft until its assets are up
        id: release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/gnarl-*
            dist/SHA256SUMS
      - name: publish it
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false > /dev/null
          echo "release ${RELEASE_ID} is published"

  # The Homebrew formula in kmoneil/homebrew-tap names the four macOS and
  # Linux binaries, each with its digest, and moving them to a new release
  # is the tap's job: its bump-gnarl workflow rewrites the formula, checks
  # every file's provenance against this workflow, installs and tests it on
  # macOS, and only then lands it. This tells it there is a release to move
  # to.
  #
  # Its own job, so a red here says what it means: by the time it runs the
  # release is out and cannot be withdrawn, so it is never "the release is
  # bad", only "the release is out and brew still installs the previous
  # one".
  #
  # Not for a prerelease, which publish does not make the latest either; the
  # tap refuses a tag that is not vX.Y.Z. Guarded on the push event itself
  # and not only through `needs: publish`, so adding always() somewhere
  # later cannot make a dispatch tell the tap anything.
  bump-the-tap:
    name: tell the tap
    needs: publish
    if: ${{ github.event_name == 'push' && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    # Nothing here uses this repository's token. The one credential is the
    # tap's, below.
    permissions: {}
    steps:
      - name: dispatch to kmoneil/homebrew-tap
        env:
          # Not github.token: that is scoped to this repository and cannot
          # dispatch to another. A fine-grained token limited to the tap,
          # with Contents: read and write, is the smallest thing that can.
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "TAP_DISPATCH_TOKEN is not set, so the formula was not bumped." >&2
            echo "brew install kmoneil/tap/gnarl still fetches the previous release." >&2
            echo >&2
            echo "To fix it for good: add a fine-grained token limited to" >&2
            echo "kmoneil/homebrew-tap, with Contents: read and write, as the" >&2
            echo "TAP_DISPATCH_TOKEN secret on this repository." >&2
            echo >&2
            echo "To fix it for ${TAG} now:" >&2
            echo "  gh workflow run bump-gnarl.yml --repo kmoneil/homebrew-tap -f tag=${TAG}" >&2
            exit 1
          fi
          gh api repos/kmoneil/homebrew-tap/dispatches \
            -f event_type=gnarl-released \
            -f "client_payload[tag]=${TAG}"
          echo "asked the tap to bump to ${TAG}"
